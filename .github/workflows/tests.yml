name: CI Tests

on:
  push:
    branches:
      - JeancaPruebasUnitarias
  pull_request:
    branches:
      - JeancaPruebasUnitarias

jobs:

  build:
    runs-on: windows-latest   # <-- Windows 11 en GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install pygame
          pip install pygame_gui
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

  test:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytest
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Run tests
        run: pytest
