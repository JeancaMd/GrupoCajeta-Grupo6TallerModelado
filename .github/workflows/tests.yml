name: CI Tests

on:
  push:
    branches: [ "CalelPruebasUnitarias" ]
  pull_request:
    branches: [ "CalelPruebasUnitarias" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install pygame==2.1.3

    - name: Build verification
      run: |
        python -c "import pygame; print('Pygame installed correctamente')"
        echo "Build OK"

    - name: Run unit tests
      run: |
        python -m pytest tests/ -v
