name: CI - Tests Unitarios

on:
  push:
    branches: [ "CalelPruebasUnitarias" ]
  pull_request:
    branches: [ "CalelPruebasUnitarias" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install bcrypt
        pip install pyodbc

  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install bcrypt
        pip install pyodbc
    
    - name: Run tests
      run: |
        pytest tests/test_database.py -v